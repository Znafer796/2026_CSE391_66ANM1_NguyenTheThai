<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý điểm sinh viên</title>

<style>

body{
font-family: Arial;
margin:40px;
}

input,select,button{
padding:8px;
margin:5px;
}

table{
border-collapse:collapse;
width:700px;
margin-top:15px;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

th{
background:#eee;
cursor:pointer;
}

.low{
background:yellow;
}

#stats{
margin-top:10px;
font-weight:bold;
}

</style>
</head>

<body>

<h2>Bảng điểm sinh viên</h2>

<input type="text" id="name" placeholder="Họ tên">
<input type="number" id="score" placeholder="Điểm (0-10)">
<button id="addBtn">Thêm</button>

<br>

<input type="text" id="search" placeholder="Tìm kiếm theo tên">

<select id="filter">
<option value="all">Tất cả</option>
<option value="Giỏi">Giỏi</option>
<option value="Khá">Khá</option>
<option value="Trung bình">Trung bình</option>
<option value="Yếu">Yếu</option>
</select>

<table>

<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th id="scoreHeader">Điểm ▲▼</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

<p id="stats"></p>

<script>

let students = [];
let filteredStudents = [];
let sortAsc = true;

function getRank(score){

if(score >= 8.5) return "Giỏi";
if(score >= 7) return "Khá";
if(score >= 5) return "Trung bình";

return "Yếu";

}

function renderTable(){

let tbody = document.getElementById("tableBody");
tbody.innerHTML="";

if(filteredStudents.length === 0){

tbody.innerHTML =
"<tr><td colspan='5'>Không có kết quả</td></tr>";

return;

}

filteredStudents.forEach((sv,index)=>{

let rank = getRank(sv.score);

let rowClass = sv.score < 5 ? "class='low'" : "";

tbody.innerHTML += `
<tr ${rowClass}>
<td>${index+1}</td>
<td>${sv.name}</td>
<td>${sv.score}</td>
<td>${rank}</td>
<td>
<button class="deleteBtn" data-name="${sv.name}" data-score="${sv.score}">
Xóa
</button>
</td>
</tr>
`;

});

updateStats();

}

function updateStats(){

let total = students.length;

let avg = 0;

if(total>0){

avg = students.reduce((sum,sv)=> sum + sv.score ,0) / total;

}

document.getElementById("stats").textContent =
`Tổng sinh viên: ${total} | Điểm trung bình: ${avg.toFixed(2)}`;

}

function addStudent(){

let name = document.getElementById("name").value.trim();
let score = Number(document.getElementById("score").value);

if(name==="" || isNaN(score) || score<0 || score>10){

alert("Dữ liệu không hợp lệ");
return;

}

students.push({name,score});

document.getElementById("name").value="";
document.getElementById("score").value="";

document.getElementById("name").focus();

applyFilters();

}

function applyFilters(){

let keyword =
document.getElementById("search").value.toLowerCase();

let filter =
document.getElementById("filter").value;

filteredStudents = students.filter(sv=>{

let matchName =
sv.name.toLowerCase().includes(keyword);

let rank = getRank(sv.score);

let matchRank =
filter==="all" || rank===filter;

return matchName && matchRank;

});

filteredStudents.sort((a,b)=>
sortAsc ? a.score-b.score : b.score-a.score
);

renderTable();

}

document.getElementById("addBtn")
.addEventListener("click",addStudent);

document.getElementById("score")
.addEventListener("keyup",function(e){

if(e.key==="Enter"){
addStudent();
}

});

document.getElementById("search")
.addEventListener("input",applyFilters);

document.getElementById("filter")
.addEventListener("change",applyFilters);

document.getElementById("scoreHeader")
.addEventListener("click",function(){

sortAsc = !sortAsc;

applyFilters();

});

document.getElementById("tableBody")
.addEventListener("click",function(e){

if(e.target.classList.contains("deleteBtn")){

let name = e.target.dataset.name;
let score = Number(e.target.dataset.score);

let index = students.findIndex(
sv => sv.name===name && sv.score===score
);

students.splice(index,1);

applyFilters();

}

});

applyFilters();

</script>

</body>
</html>
