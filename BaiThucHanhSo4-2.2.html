<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>Form đặt hàng</title>

<style>

body{
font-family:Arial;
margin:40px;
}

form{
width:400px;
}

label{
display:block;
margin-top:12px;
}

input,select,textarea{
width:100%;
padding:8px;
margin-top:5px;
}

textarea{
height:80px;
}

.error{
color:red;
font-size:13px;
}

.invalid{
border:2px solid red;
}

.valid{
border:2px solid green;
}

#counter{
font-size:12px;
text-align:right;
}

#total{
font-weight:bold;
margin-top:10px;
}

#confirmBox{
border:1px solid #ccc;
padding:15px;
margin-top:20px;
display:none;
}

button{
margin-top:10px;
padding:10px;
}

.success{
color:green;
font-size:22px;
}

</style>
</head>

<body>

<h2>Đặt hàng</h2>

<form id="orderForm">

<label>Sản phẩm</label>
<select id="product">
<option value="">-- Chọn sản phẩm --</option>
<option value="Ao">Áo</option>
<option value="Quan">Quần</option>
<option value="Giay">Giày</option>
</select>
<span class="error" id="productError"></span>

<label>Số lượng</label>
<input type="number" id="quantity">
<span class="error" id="quantityError"></span>

<label>Ngày giao hàng</label>
<input type="date" id="date">
<span class="error" id="dateError"></span>

<label>Địa chỉ giao</label>
<input id="address">
<span class="error" id="addressError"></span>

<label>Ghi chú</label>
<textarea id="note"></textarea>
<div id="counter">0/200</div>
<span class="error" id="noteError"></span>

<label>Thanh toán</label>

<input type="radio" name="pay" value="COD"> COD
<input type="radio" name="pay" value="Bank"> Chuyển khoản
<input type="radio" name="pay" value="Wallet"> Ví điện tử

<span class="error" id="payError"></span>

<div id="total">Tổng tiền: 0 VND</div>

<button type="submit">Đặt hàng</button>

</form>

<div id="confirmBox"></div>

<div id="success"></div>

<script>

const prices={
Ao:150000,
Quan:200000,
Giay:500000
};

function showError(id,msg){

document.getElementById(id+"Error").textContent=msg;
document.getElementById(id)?.classList.add("invalid");

}

function clearError(id){

document.getElementById(id+"Error").textContent="";
document.getElementById(id)?.classList.remove("invalid");

}

function validateProduct(){

if(product.value===""){

showError("product","Vui lòng chọn sản phẩm");
return false;

}

clearError("product");
return true;

}

function validateQuantity(){

let q=Number(quantity.value);

if(!Number.isInteger(q) || q<1 || q>99){

showError("quantity","Số lượng từ 1 đến 99");
return false;

}

clearError("quantity");
return true;

}

function validateDate(){

let d=new Date(date.value);
let today=new Date();

today.setHours(0,0,0,0);

let max=new Date();
max.setDate(today.getDate()+30);

if(!date.value){

showError("date","Chọn ngày giao");
return false;

}

if(d<today){

showError("date","Không được là ngày quá khứ");
return false;

}

if(d>max){

showError("date","Không quá 30 ngày");
return false;

}

clearError("date");
return true;

}

function validateAddress(){

let addr=address.value.trim();

if(addr.length<10){

showError("address","Địa chỉ ≥10 ký tự");
return false;

}

clearError("address");
return true;

}

function validateNote(){

if(note.value.length>200){

showError("note","Tối đa 200 ký tự");
return false;

}

clearError("note");
return true;

}

function validatePay(){

let pay=document.querySelector("input[name='pay']:checked");

if(!pay){

document.getElementById("payError").textContent="Chọn phương thức thanh toán";
return false;

}

document.getElementById("payError").textContent="";
return true;

}

function updateTotal(){

let p=product.value;
let q=Number(quantity.value);

let price=prices[p]||0;

let total=price*q;

document.getElementById("total").textContent=
"Tổng tiền: "+total.toLocaleString("vi-VN")+" VND";

}

product.addEventListener("change",updateTotal);
quantity.addEventListener("input",updateTotal);

note.addEventListener("input",function(){

let len=note.value.length;

counter.textContent=len+"/200";

if(len>200){

counter.style.color="red";

}else{

counter.style.color="black";

}

});

product.addEventListener("blur",validateProduct);
quantity.addEventListener("blur",validateQuantity);
date.addEventListener("blur",validateDate);
address.addEventListener("blur",validateAddress);
note.addEventListener("blur",validateNote);

product.addEventListener("input",()=>clearError("product"));
quantity.addEventListener("input",()=>clearError("quantity"));
date.addEventListener("input",()=>clearError("date"));
address.addEventListener("input",()=>clearError("address"));
note.addEventListener("input",()=>clearError("note"));

orderForm.addEventListener("submit",function(e){

e.preventDefault();

let valid=
validateProduct() &
validateQuantity() &
validateDate() &
validateAddress() &
validateNote() &
validatePay();

if(!valid) return;

let p=product.value;
let q=quantity.value;
let total=(prices[p]*q).toLocaleString("vi-VN");

confirmBox.style.display="block";

confirmBox.innerHTML=`

<h3>Xác nhận đơn hàng</h3>

<p>Sản phẩm: ${p}</p>
<p>Số lượng: ${q}</p>
<p>Tổng tiền: ${total} VND</p>
<p>Ngày giao: ${date.value}</p>

<button id="confirmBtn">Xác nhận</button>
<button id="cancelBtn">Hủy</button>

`;

document.getElementById("confirmBtn").onclick=function(){

orderForm.style.display="none";
confirmBox.style.display="none";

success.innerHTML=
`<p class="success">Đặt hàng thành công 🎉</p>`;

};

document.getElementById("cancelBtn").onclick=function(){

confirmBox.style.display="none";

};

});

</script>

</body>
</html>
